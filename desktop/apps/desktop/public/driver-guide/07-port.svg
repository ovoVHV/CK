<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">看到 COM 端口后，在 CK 选同一个 · 操作示意</title><rect width="720" height="410" fill="#f4f4ed"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="25" y="40" font-size="25" fill="#272b24" font-weight="700">看到 COM 端口后，在 CK 选同一个</text><text x="573" y="39" font-size="18" fill="#7a7e73" font-weight="400">操作示意</text><rect x="25" y="72" width="670" height="151" rx="10" fill="#fff" stroke="#dadbd3"/><text x="47" y="105" font-size="20" fill="#72796b" font-weight="400">设备管理器</text><text x="48" y="144" font-size="24" fill="#292c29" font-weight="600">⌄  端口（COM 和 LPT）</text><rect x="72" y="160" width="519" height="45" rx="5" fill="#ecf5e9" stroke="#a2bf98"/><text x="89" y="191" font-size="25" fill="#326c36" font-weight="700">USB-SERIAL CH340 (COM5)</text><rect x="25" y="242" width="670" height="127" rx="10" fill="#fff" stroke="#dadbd3"/><text x="47" y="277" font-size="20" fill="#72796b" font-weight="400">CK · 编程页</text><text x="47" y="321" font-size="25" fill="#292c29" font-weight="600">选择串口</text><text x="184" y="323" font-size="27" fill="#bc470b" font-weight="400">→</text><rect x="236" y="291" width="200" height="46" rx="5" fill="#fff0e5" stroke="#bc470b"/><text x="264" y="323" font-size="27" fill="#bc470b" font-weight="700">COM5</text><text x="465" y="321" font-size="23" fill="#292c29" font-weight="400">再点击上传</text><text x="47" y="354" font-size="18" fill="#72796b" font-weight="400">COM5 仅为示例；以你电脑实际显示的编号为准</text><text x="25" y="395" font-size="16" fill="#747a6e" font-weight="400">界面会随 Windows / 浏览器版本略有不同</text></g></svg>