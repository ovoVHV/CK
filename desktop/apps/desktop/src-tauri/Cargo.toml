[package]
name = "appsdesktop"
version = "9.1.0-alpha.55"
description = "CK graphical programming desktop for embedded hardware"
authors = ["CK"]
edition = "2021"

[features]
# Production Tauri builds enable this feature so the WebView serves the
# bundled frontend through Tauri's application protocol instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "appsdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ck-update-protocol = { path = "../../../../update-protocol" }
jsonschema = { version = "0.33", default-features = false }
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
ck_core = { path = "../../../crates/ck_core" }
arduino = { path = "../../../crates/arduino" }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
zip = "7.2.0"
directories = "6.0.0"
uuid = { version = "1.20.0", features = ["v4"] }
dirs = "5"
regex = "1.12.2"
walkdir = "2.5.0"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
junction = "1.2.0"
hex = "0.4.3"
quick-xml = "0.38.4"
semver = "1.0.27"
sha2 = "0.10.9"
url = "2"

[dev-dependencies]
tempfile = "3"
