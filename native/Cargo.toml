[package]
name = "ck-build-engine-native"
version = "9.1.0-alpha.7"
edition = "2021"

[build-dependencies]
embed-resource = "=3.0.6"

[dependencies]
ck-update-protocol = { path = "../update-protocol" }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
