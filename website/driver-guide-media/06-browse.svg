<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">选择解压目录，并包括子文件夹 · 操作示意</title><rect width="720" height="410" fill="#f4f4ed"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="25" y="40" font-size="25" fill="#272b24" font-weight="700">选择解压目录，并包括子文件夹</text><text x="573" y="39" font-size="18" fill="#7a7e73" font-weight="400">操作示意</text><rect x="24" y="70" width="672" height="300" rx="10" fill="#fff" stroke="#dadbd3"/><rect x="24" y="70" width="672" height="43" rx="10" fill="#eeefea" stroke="#dadbd3"/><text x="45" y="99" font-size="20" fill="#63685e" font-weight="400">浏览我的电脑以查找驱动程序</text><text x="645" y="99" font-size="24" fill="#292c29" font-weight="400">×</text><circle cx="61" cy="138" r="17" fill="#bc470b"/><text x="61" text-anchor="middle" y="145" font-size="21" fill="#fff" font-weight="700">1</text><text x="91" y="145" font-size="22" fill="#bc470b" font-weight="700">浏览… → 选择刚解压出的文件夹</text><rect x="52" y="167" width="481" height="45" rx="10" fill="#fafbf7" stroke="#dadbd3"/><text x="65" y="197" font-size="21" fill="#292c29" font-weight="400">下载 / CDM-v2.12.36.20…</text><rect x="551" y="167" width="116" height="45" rx="4" fill="#fff0e5" stroke="#bc470b"/><text x="569" y="197" font-size="21" fill="#bc470b" font-weight="700">浏览…</text><rect x="54" y="242" width="26" height="26" rx="3" fill="#bc470b" stroke="#bc470b"/><text x="58" y="262" font-size="22" fill="#fff" font-weight="700">✓</text><text x="94" y="263" font-size="24" fill="#292c29" font-weight="600">包括子文件夹</text><circle cx="330" cy="255" r="17" fill="#bc470b"/><text x="330" text-anchor="middle" y="262" font-size="21" fill="#fff" font-weight="700">2</text><rect x="510" y="299" width="156" height="47" rx="4" fill="#fff0e5" stroke="#bc470b"/><text x="544" y="330" font-size="24" fill="#bc470b" font-weight="700">下一步</text><circle cx="470" cy="322" r="17" fill="#bc470b"/><text x="470" text-anchor="middle" y="329" font-size="21" fill="#fff" font-weight="700">3</text><text x="54" y="331" font-size="22" fill="#292c29" font-weight="400">选择文件夹，不选择 ZIP</text><text x="25" y="395" font-size="16" fill="#747a6e" font-weight="400">界面会随 Windows / 浏览器版本略有不同</text></g></svg>