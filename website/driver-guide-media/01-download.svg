<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">找到刚下载的 ZIP 文件 · 操作示意</title><rect width="720" height="410" fill="#f4f4ed"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="25" y="40" font-size="25" fill="#272b24" font-weight="700">找到刚下载的 ZIP 文件</text><text x="573" y="39" font-size="18" fill="#7a7e73" font-weight="400">操作示意</text><rect x="24" y="70" width="672" height="300" rx="10" fill="#fff" stroke="#dadbd3"/><rect x="24" y="70" width="672" height="43" rx="10" fill="#eeefea" stroke="#dadbd3"/><text x="45" y="99" font-size="20" fill="#63685e" font-weight="400">浏览器 · 下载记录</text><text x="645" y="99" font-size="24" fill="#292c29" font-weight="400">×</text><circle cx="59" cy="140" r="17" fill="#bc470b"/><text x="59" text-anchor="middle" y="147" font-size="21" fill="#fff" font-weight="700">1</text><text x="89" y="147" font-size="22" fill="#bc470b" font-weight="700">按 Ctrl + J，打开下载记录</text><rect x="48" y="172" width="624" height="162" rx="10" fill="#fafbf7" stroke="#dadbd3"/><rect x="69" y="191" width="40" height="49" rx="3" fill="#fff" stroke="#aeb8c0"/><text x="73" y="223" font-size="13" fill="#6b747e" font-weight="700">ZIP</text><text x="126" y="215" font-size="24" fill="#292c29" font-weight="600">CH341SER-4.0.ZIP</text><text x="126" y="249" font-size="19" fill="#637462" font-weight="400">下载完成</text><rect x="119" y="267" width="246" height="49" rx="10" fill="#fff0e5" stroke="#bc470b"/><text x="137" y="300" font-size="24" fill="#bc470b" font-weight="600">在文件夹中显示</text><circle cx="401" cy="292" r="17" fill="#bc470b"/><text x="401" text-anchor="middle" y="299" font-size="21" fill="#fff" font-weight="700">2</text><text x="25" y="395" font-size="16" fill="#747a6e" font-weight="400">界面会随 Windows / 浏览器版本略有不同</text></g></svg>