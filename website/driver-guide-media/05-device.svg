<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">FTDI：找到插入后出现的设备 · 操作示意</title><rect width="720" height="410" fill="#f4f4ed"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="25" y="40" font-size="25" fill="#272b24" font-weight="700">FTDI：找到插入后出现的设备</text><text x="573" y="39" font-size="18" fill="#7a7e73" font-weight="400">操作示意</text><rect x="24" y="70" width="672" height="300" rx="10" fill="#fff" stroke="#dadbd3"/><rect x="24" y="70" width="672" height="43" rx="10" fill="#eeefea" stroke="#dadbd3"/><text x="45" y="99" font-size="20" fill="#63685e" font-weight="400">设备管理器</text><text x="645" y="99" font-size="24" fill="#292c29" font-weight="400">×</text><text x="51" y="145" font-size="24" fill="#292c29" font-weight="600">⌄  其他设备</text><rect x="74" y="163" width="299" height="53" rx="10" fill="#fff0e5" stroke="#bc470b"/><text x="93" y="198" font-size="22" fill="#bc470b" font-weight="600">USB Serial Converter</text><text x="92" y="249" font-size="20" fill="#72796b" font-weight="400">也可能显示为未知设备</text><rect x="409" y="143" width="257" height="148" rx="10" fill="#fff" stroke="#b8bbb1"/><text x="427" y="177" font-size="21" fill="#292c29" font-weight="400">右键对应设备</text><rect x="421" y="192" width="233" height="46" rx="5" fill="#fff0e5" stroke="#bc470b"/><text x="432" y="223" font-size="23" fill="#bc470b" font-weight="700">更新驱动程序</text><text x="428" y="270" font-size="20" fill="#72796b" font-weight="400">属性…</text><text x="52" y="334" font-size="24" fill="#292c29" font-weight="400">开始按钮右键 → 设备管理器</text><text x="52" y="361" font-size="19" fill="#72796b" font-weight="400">先插拔一次，确认哪一项对应你的开发板</text><text x="25" y="395" font-size="16" fill="#747a6e" font-weight="400">界面会随 Windows / 浏览器版本略有不同</text></g></svg>