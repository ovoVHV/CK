[package]
name = "ck_core"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "process", "rt", "rt-multi-thread"] }
num_cpus = "1.0"
serialport = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
dirs = "5.0"
futures-util = "0.3"
thiserror = "2"
log = "0.4"
anyhow = "1.0"
regex = "1.10"
lazy_static = "1.5"
shlex = "1.3.0"
tempfile = "3"
junction = "1.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
junction = "1.2.0"
tokio = { version = "1", features = ["full"] }
regex = "1.12.2"
lazy_static = "1.5.0"
